<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هندسهٔ تحلیلی – درس اول</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:#3b2a1d;background:#4a3322;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(50,25,5,.12),rgba(50,25,5,.3)),var(--bg) center/cover no-repeat}
#bg{position:fixed;inset:0;z-index:1;pointer-events:none}
#deco{position:fixed;bottom:22px;left:0;right:0;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;font-size:clamp(60px,12vw,130px);line-height:1;pointer-events:none;direction:ltr}
#foot{position:fixed;bottom:0;left:0;right:0;z-index:3;text-align:center;color:#fff;font:600 14px/1.8 Georgia,serif;letter-spacing:1px;background:rgba(70,35,15,.55);direction:ltr;padding-bottom:env(safe-area-inset-bottom,0px)}
#app{position:relative;z-index:2;max-width:860px;margin:16px auto calc(38vh + 40px);background:#fff;border-radius:22px;padding:20px 18px 26px;box-shadow:0 10px 40px rgba(60,25,5,.35);min-height:70vh;font-size:17px;line-height:2}
@media(max-width:600px){#app{margin:10px 8px calc(38vh + 40px);padding:14px 10px 20px;font-size:16px}}
h1,h2{margin:.2em 0;color:#b4491a;text-align:center}
h1{font-size:1.7em}
.sub{text-align:center;color:#7a5a43;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.btn{font:inherit;font-weight:800;cursor:pointer;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);border:3px solid #000;border-radius:16px;padding:13px 12px;background:linear-gradient(#f59a2c,#c75e08);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.25),0 6px 0 #000,0 10px 14px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.25),0 1px 0 #000}
.c1,.btn.ex{background:linear-gradient(#ffd84a,#e0a100);color:#3a2600;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.c2{background:linear-gradient(#f59a2c,#c75e08)}
.c3,.btn.q{background:linear-gradient(#f0614f,#b3201a)}
.c4,.back{background:linear-gradient(#b27a44,#6b4020)}
.c5{background:linear-gradient(#b4b9c1,#6c727c)}
.btn.ex{margin:14px auto;display:block;min-width:180px}
.back{display:block;margin:22px auto 0;min-width:220px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.04)}}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:5;border-radius:30px;padding:8px 14px;font-size:14px}
.pl{display:block;margin:8px auto;width:100%;max-width:440px;direction:ltr;background:#fffdf8;border:1px solid #f0dcc0;border-radius:12px}
.dr{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dd 1.6s forwards}
@keyframes dd{to{stroke-dashoffset:0}}
.fd{opacity:0;animation:fi .6s forwards}
@keyframes fi{to{opacity:1}}
.st{margin:6px 0;animation:up .5s both;text-align:right}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fin{font-weight:800;animation:up .5s both,pulse 1s ease-in-out .5s 3,rgb 3s linear .5s both}
.fin math{font-weight:bold}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes rgb{0%,33%{color:#e02020}34%,66%{color:#1c9c3a}67%,99%{color:#1f5fe0}100%{color:#3b2a1d}}
math{font-family:"Latin Modern Math","STIX Two Math","Cambria Math","Noto Sans Math",serif;font-size:1.3em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
math[display=block]{margin:6px 0}
.fl{direction:ltr;text-align:center;overflow-x:auto;padding:2px 0}
.ex-box{border-top:2px dashed #e8a317;margin-top:8px;padding-top:6px;background:#fffaf0;border-radius:10px;padding:8px}
.opt{border:2px solid #f0dcc0;border-radius:12px;margin:6px 0;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.opt.sel{border-color:#c2410c;background:#ffe9d6}
.opt.ok{border-color:#3a9d3a;background:#e4f6e4}
.opt.bad{border-color:#d33;background:#fde4e4}
.opt math{margin:0}
.qb{border:1px solid #f0dcc0;border-radius:14px;padding:10px;margin:12px 0}
.sc{font-size:1.6em;text-align:center;font-weight:800;color:#b4491a}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
@media(prefers-reduced-motion:reduce){.back,.fin{animation:none}}
.hero{display:block;width:100%;border-radius:16px;border:3px solid #000;box-shadow:0 5px 0 #000}
.fin math{font-weight:bold;-webkit-text-stroke:.7px currentColor}

function fa(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=n.nodeValue.replace(/\d/g,d=>FD[d])}
/* MathML helpers */
function T(s){const re=/(\d+)|([A-Za-z′]+)|_(\w)|\^(\d)|\s+|(.)/g;let m,a=[];
while(m=re.exec(s)){if(m[1])a.push(`<mn>${m[1]}</mn>`);else if(m[2])a.push(`<mi>${m[2]}</mi>`);
else if(m[3]){const l=a.pop(),t=/\d/.test(m[3])?'mn':'mi';a.push(`<msub>${l}<${t}>${m[3]}</${t}></msub>`)}
else if(m[4]){const l=a.pop();a.push(`<msup>${l}<mn>${m[4]}</mn></msup>`)}
else if(m[5])a.push(`<mo>${m[5]=='-'?'−':m[5]}</mo>`)}return a.join('')}
const fr=(a,b)=>`<mfrac><mrow>${a}</mrow><mrow>${b}</mrow></mfrac>`,sq=a=>`<msqrt>${a}</msqrt>`,F=(a,b)=>fr(T(a),T(b)),M=x=>`<math dir="ltr">${x}</math>`;
const sg=v=>v<0?`(${v})`:`${v}`;
/* SVG helpers */
const P=(x,y)=>[30+25*x,230-25*y];
function plane(inner){let g='';for(let i=0;i<=12;i++){const[a]=P(i,0);g+=`<line x1="${a}" y1="20" x2="${a}" y2="230" stroke="#eee"/>`}
for(let j=0;j<=8;j++){const[,b]=P(0,j);g+=`<line x1="30" y1="${b}" x2="320" y2="${b}" stroke="#eee"/>`}
return `<svg viewBox="0 0 330 260" class="pl">${g}<path d="M30 235V12M25 230H325" stroke="#444" stroke-width="1.6" fill="none"/><text x="318" y="246" font-size="13">x</text><text x="14" y="20" font-size="13">y</text>${inner}</svg>`}
const ln=(a,b,c,d,col,dl,dash)=>{const[p,q]=P(a,b),[r,s]=P(c,d);return `<line x1="${p}" y1="${q}" x2="${r}" y2="${s}" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="6 4" class="fd"':'class="dr"'} style="animation-delay:${dl}s"/>`};
const pt=(x,y,l,dx,dy,dl)=>{const[p,q]=P(x,y);return `<g class="fd" style="animation-delay:${dl}s"><circle cx="${p}" cy="${q}" r="4.5" fill="#333"/><text x="${p+dx}" y="${q+dy}" font-size="13" font-weight="700">${l}</text></g>`};
const tx=(x,y,t,dl,col='#333')=>{const[p,q]=P(x,y);return `<text class="fd" style="animation-delay:${dl}s" x="${p}" y="${q}" font-size="12" fill="${col}">${t}</text>`};

const fra=(n,d)=>n<0?M(T('−')+F(`${-n}`,`${d}`)):M(F(`${n}`,`${d}`));
const GEN=[
()=>{const dx=R(1,4),m=pick([-3,-2,-1,1,2,3]),x1=R(0,5),y1=R(0,5),x2=x1+dx,y2=y1+m*dx;
return mk(`شیب خط گذرنده از ${pM('A',x1,y1)} و ${pM('B',x2,y2)} کدام است؟`,[num(m),num(-m),num(m+1),num(m-1)].map(String),
[M(T('m=')+F(`${y2}-${sg(y1)}`,`${x2}-${x1}`)+T('=')+F(`${y2-y1}`,`${dx}`)+T(`=${m}`))])},
()=>{const[p,q]=pick([[1,2],[2,3],[3,4],[3,5],[2,5],[4,3],[5,2]]),s=pick([1,-1]);
return mk(`شیب خطی که بر خطی با شیب ${fra(s*p,q)} عمود است کدام است؟`,[fra(-s*q,p),fra(s*q,p),fra(s*p,q),fra(-s*p,q)],
[M(T('m×m′=−1 ⇒ m′=−')+F('1','m')),M(T('m′=')+(-s*q<0?T('−'):'')+F(`${q}`,`${p}`))])},
()=>{const[a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]),x1=R(0,4),y1=R(0,4),x2=x1+a,y2=y1+b;
return mk(`فاصلهٔ ${pM('A',x1,y1)} و ${pM('B',x2,y2)} کدام است؟`,[c,a+b,c+1,c-1,c+2,c+3].map(num),
[M(T('AB=')+sq(T(`(${x1}-${x2})^2+(${y1}-${y2})^2`))+T('=')+sq(T(`${a*a}+${b*b}`))+T(`=${c}`))])},
()=>{const x1=R(0,9),y1=R(0,9);let x2=R(0,9),y2=R(0,9);if((x1+x2)%2)x2++;if((y1+y2)%2)y2++;const mx=(x1+x2)/2,my=(y1+y2)/2,f=(a,b)=>M(T(`(${a},${b})`));
return mk(`مختصات وسط پاره‌خط AB را بیابید: ${pM('A',x1,y1)} و ${pM('B',x2,y2)}`,[f(mx,my),f(mx+1,my),f(mx,my-1),f(x1+x2,y1+y2),f(mx+2,my+1)],
[M(T('M(')+F(`${x1}+${x2}`,'2')+T(',')+F(`${y1}+${y2}`,'2')+T(`)=(${mx},${my})`))])},
()=>{const[a,b,N]=pick([[3,4,5],[6,8,10],[5,12,13]]),x0=R(1,5),y0=R(1,5),k=R(1,4),v=N*k,c=v-(a*x0+b*y0),e=`${a}x+${b}y${c<0?'-':'+'}${Math.abs(c)}=0`;
return mk(`فاصلهٔ ${pM('A',x0,y0)} از خط ${M(T(e))} کدام است؟`,[k,k+1,k+2,v,2*k+1].map(num),
[M(T('d=')+fr(T(`|${a}(${x0})+${b}(${y0})${c<0?'-':'+'}${Math.abs(c)}|`),sq(T(`${a}^2+${b}^2`)))+T('=')+F(`${v}`,`${N}`)+T(`=${k}`))])}];
let Q=[],A=[];
function quiz(){clr();Q=GEN.map(g=>g());A=Q.map(()=>-1);
app.innerHTML=`<h2>📝 آزمون ۵ سؤالی</h2>`+Q.map((q,i)=>`<div class="qb"><b>سؤال ${i+1}.</b> ${q.q}${q.o.map((o,j)=>`<div class="opt" onclick="sel(${i},${j})"><b>${'الف ب ج د'.split(' ')[j]})</b>${o}</div>`).join('')}</div>`).join('')+`<button class="btn q" style="display:block;margin:14px auto" onclick="result()">دیدن نتیجه</button><button class="btn back" onclick="home()">🏠 بازگشت به صفحهٔ اول</button>`;fa(app);scrollTo(0,0)}
function sel(i,j){A[i]=j;document.querySelectorAll('.qb')[i].querySelectorAll('.opt').forEach((e,k)=>e.classList.toggle('sel',k==j))}
function result(){let sc=0;const L='الف ب ج د'.split(' ');
const h=Q.map((q,i)=>{const ok=A[i]==q.c;sc+=ok;return `<div class="qb"><b>سؤال ${i+1}.</b> ${q.q}<div class="opt ${ok?'ok':'bad'}">${ok?'✅':'❌'} گزینهٔ شما: ${A[i]<0?'بدون پاسخ':L[A[i]]+') '+q.o[A[i]]}</div><div class="opt ok">✔ پاسخ درست: ${L[q.c]}) ${q.o[q.c]}</div><b>حل:</b>${q.s.map(x=>'<div class="fl">'+x.replace('<math dir="ltr">','<math dir="ltr" display="block">')+'</div>').join('')}</div>`}).join('');
app.innerHTML=`<h2>نتیجهٔ آزمون</h2><div class="sc">${sc} از 5</div>${sc>=4?'<div class="sub">🎉 آفرین! عالی بود!</div>':'<div class="sub">با مرور فرمول‌ها دفعهٔ بعد بهتر می‌شود 🍂</div>'}${h}<button class="btn c2" style="display:block;margin:14px auto" onclick="quiz()">🔄 آزمون جدید</button><button class="btn back" onclick="home()">🏠 بازگشت به صفحهٔ اول</button>`;fa(app);scrollTo(0,0);if(sc>=4)celebrate()}
function celebrate(){boost=1;setTimeout(()=>boost=0,2000)}
/* Music */
const au=new Audio('https://my.uploadkon.ir/d/qVYmBlWFKJrQYZLb1a6mF0XjyhNABf/MTE3NTAzfHBhZA.mp3');au.preload='metadata';
const st=()=>{try{au.currentTime=3}catch(e){}};au.addEventListener('loadedmetadata',st);au.addEventListener('ended',()=>{st();au.play()});
function music(){const b=$('#mus');if(au.paused){if(au.currentTime<3)st();au.play().then(()=>b.textContent='⏸ توقف آهنگ').catch(()=>b.textContent='⚠️ آهنگ بارگذاری نشد')}else{au.pause();b.textContent='🎵 پخش آهنگ'}}
/* Background: maple leaves + rain */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,boost=0,leaves=[],drops=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const PAL=[['#7cb342','#cddc39'],['#9ccc3a','#f9a825'],['#fdd835','#f9a825'],['#fdd835','#ef6c00'],['#ff9800','#e65100'],['#ff7043','#b71c1c'],['#e53935','#7f0000'],['#a1662f','#4e2c12'],['#8bc34a','#ff9800'],['#ffd54f','#d32f2f']];
const LP=new Path2D('M50 4L58 22L70 16L66 38L88 30L80 48L96 52L72 66L76 76L54 72L54 90L46 90L46 72L24 76L28 66L4 52L20 48L12 30L34 38L30 16L42 22Z');
const SP=PAL.map(([a,b])=>{const c=document.createElement('canvas');c.width=c.height=100;const g=c.getContext('2d'),gr=g.createLinearGradient(10,10,90,90);gr.addColorStop(0,a);gr.addColorStop(1,b);
g.fillStyle=gr;g.fill(LP);g.lineJoin='round';g.lineWidth=2;g.strokeStyle='rgba(60,25,5,.55)';g.stroke(LP);
g.lineWidth=1.4;g.strokeStyle='rgba(70,30,5,.5)';g.beginPath();[[50,72,50,10],[50,72,14,50],[50,72,86,50],[50,72,28,22],[50,72,72,22]].forEach(([x1,y1,x2,y2])=>{g.moveTo(x1,y1);g.lineTo(x2,y2)});g.stroke();
g.strokeStyle='#5a3418';g.lineWidth=3;g.beginPath();g.moveTo(50,72);g.lineTo(50,98);g.stroke();return c});
function nl(big,top){const spin=Math.random()<.45;return{x:Math.random()*W,y:top?-60:Math.random()*H,s:big?R(34,60):R(24,46),v:.8+Math.random()*1.5,a:Math.random()*6.28,va:spin?(Math.random()<.5?-1:1)*(.04+Math.random()*.07):0,spin,ph:Math.random()*6.28,pv:.012+Math.random()*.02,fl:Math.random()*6,fv:spin?.03+Math.random()*.05:0,sp:pick(SP),big}}
for(let i=0;i<30;i++)leaves.push(nl());for(let i=0;i<110;i++)drops.push({x:Math.random()*W,y:Math.random()*H,l:R(10,22),v:R(9,15)});
(function loop(){cx.clearRect(0,0,W,H);cx.strokeStyle='rgba(235,245,255,.8)';cx.lineWidth=1.6;cx.beginPath();
drops.forEach(d=>{cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.25,d.y+d.l);d.y+=d.v;d.x-=d.v*.25;if(d.y>H){d.y=-20;d.x=Math.random()*W+40}});cx.stroke();
if(boost&&leaves.length<240&&Math.random()<.85)leaves.push(nl(1,1));
leaves=leaves.filter(l=>!(l.big&&l.y>H+70));
leaves.forEach(l=>{l.ph+=l.pv;l.y+=l.v;l.x+=Math.sin(l.ph)*1.5+.3;l.fl+=l.fv;
const rot=l.spin?(l.a+=l.va):Math.sin(l.ph)*.8+l.a*.15;
if(l.y>H+60&&!l.big){l.y=-60;l.x=Math.random()*W}
cx.save();cx.translate(l.x,l.y);cx.rotate(rot);cx.scale(l.spin?Math.cos(l.fl):1,1);cx.drawImage(l.sp,-l.s/2,-l.s/2,l.s,l.s);cx.restore()});
requestAnimationFrame(loop)})();
home();
</script>
